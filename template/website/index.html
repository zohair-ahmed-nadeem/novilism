{% extends 'layout.html' %}

{% block content %}
<h1>Home</h1>

<h1>All Posts</h1>
    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <img src="{{ post.image.url }}" alt="{{ post.title }}">
            <a>Read More</a>
        </div>
    {% endfor %}
    
{% endblock  %}
