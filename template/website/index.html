{% extends 'layout.html' %}

{% block content %}
<h1>Home</h1>

<h1>All Posts</h1>
<div>
    
    {% for post in posts %}
        <div>
            <div class="post-owner">
                <img src="{{ post.owner.profile.profile_picture.url }}" alt="{{ post.owner.username }}">
                <p>{{ post.owner.username }}</p>
            </div>
            <h2>{{ post.title }}</h2>
            <img src="{{ post.image.url }}" alt="{{ post.title }}" style="max-width: 300px; height: auto;">
            <a href="{% url 'post_detail' post.id %}">Read More</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
